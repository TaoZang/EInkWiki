<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>向墨水维基导入 ZIM</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 720px; margin: 40px auto; padding: 0 20px; color: #000;
      background: #fff; font-family: system-ui, sans-serif; line-height: 1.55; }
    h1 { font-size: 1.6rem; }
    .panel { border: 2px solid #000; padding: 20px; }
    input, button { width: 100%; min-height: 48px; margin-top: 14px; font-size: 1rem; }
    button { border: 2px solid #000; background: #000; color: #fff; cursor: pointer; }
    button:disabled { background: #777; cursor: default; }
    progress { width: 100%; height: 24px; margin-top: 18px; accent-color: #000; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>向墨水维基导入 ZIM</h1>
  <div class="panel">
    <p>选择任意扩展名为 <strong>.zim</strong> 的文件。文件只在当前局域网内传输。</p>
    <input id="file" type="file" accept=".zim,application/x-zim">
    <button id="start">开始传输</button>
    <progress id="progress" max="100" value="0"></progress>
    <p id="status">等待选择文件</p>
  </div>
  <script>
    const chunkSize = 8 * 1024 * 1024;
    const fileInput = document.getElementById('file');
    const startButton = document.getElementById('start');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');

    function formatBytes(bytes) {
      const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
      return (value >= 100 ? value.toFixed(0) : value.toFixed(1)) + ' ' + units[unit];
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      const text = await response.text();
      if (!response.ok) throw new Error(text || ('HTTP ' + response.status));
      return text ? JSON.parse(text) : {};
    }

    function show(snapshot, speed) {
      const total = Number(snapshot.total || 0);
      const received = Number(snapshot.received || 0);
      const percent = total > 0 ? Math.floor(received * 100 / total) : 0;
      progress.value = percent;
      let line = snapshot.message || '';
      if (total > 0) line += '\n' + percent + '% · ' + formatBytes(received) + ' / ' + formatBytes(total);
      if (speed > 0 && snapshot.state === 'receiving') line += ' · ' + formatBytes(speed) + '/s';
      status.textContent = line;
    }

    startButton.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { status.textContent = '请先选择 ZIM 文件'; return; }
      if (!file.name.toLowerCase().endsWith('.zim')) {
        status.textContent = '只支持扩展名为 .zim 的文件'; return;
      }
      startButton.disabled = true;
      fileInput.disabled = true;
      const params = 'name=' + encodeURIComponent(file.name) + '&size=' + file.size;
      try {
        let snapshot = await api('/api/status?' + params);
        let offset = Number(snapshot.received || 0);
        let sampleBytes = offset;
        let sampleTime = performance.now();
        show(snapshot, 0);
        while (offset < file.size) {
          const end = Math.min(file.size, offset + chunkSize);
          snapshot = await api('/api/upload?' + params + '&offset=' + offset, {
            method: 'PUT',
            headers: {'Content-Type': 'application/octet-stream'},
            body: file.slice(offset, end)
          });
          offset = Number(snapshot.received || end);
          const now = performance.now();
          const seconds = (now - sampleTime) / 1000;
          const speed = seconds > 0 ? (offset - sampleBytes) / seconds : 0;
          show(snapshot, speed);
          sampleBytes = offset;
          sampleTime = now;
        }
        show(snapshot, 0);
      } catch (error) {
        status.textContent = '传输失败：' + error.message + '\n重新选择同一文件可继续传输。';
      } finally {
        startButton.disabled = false;
        fileInput.disabled = false;
      }
    });
  </script>
</body>
</html>
