name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK components
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          tasks=(lintDebug testDebugUnitTest assembleDebug)
          gradle_args=(--no-daemon)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
              printf 'Release tag must point to a commit reachable from %s.\n' "$DEFAULT_BRANCH" >&2
              exit 1
            fi
            version_part='(0|[1-9][0-9]{0,17})'
            if [[ ! "$GITHUB_REF_NAME" =~ ^v${version_part}\.${version_part}\.${version_part}$ ]]; then
              printf 'Release tag must use canonical vX.Y.Z form: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
            tasks+=(lintRelease testReleaseUnitTest assembleRelease)
            gradle_args+=(
              "-PversionName=${GITHUB_REF_NAME#v}"
              "-PversionCode=${GITHUB_RUN_NUMBER}"
            )
          fi
          ./gradlew "${gradle_args[@]}" "${tasks[@]}"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eink-wiki-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Sign tagged release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          required_secrets=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            printf 'Tag release aborted. Missing GitHub Actions secrets:\n' >&2
            printf '  - %s\n' "${missing_secrets[@]}" >&2
            exit 1
          fi

          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$unsigned_apk" ]]; then
            printf 'Unsigned release APK was not produced at %s\n' "$unsigned_apk" >&2
            exit 1
          fi

          apksigner_path="$(find "${ANDROID_HOME:?}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" || ! -x "$apksigner_path" ]]; then
            printf 'Android SDK apksigner was not found.\n' >&2
            exit 1
          fi
          zipalign_path="$(dirname "$apksigner_path")/zipalign"
          if [[ ! -x "$zipalign_path" ]]; then
            printf 'Android SDK zipalign was not found next to apksigner.\n' >&2
            exit 1
          fi

          signing_dir="${RUNNER_TEMP:?}/eink-wiki-signing"
          mkdir -p "$signing_dir" signed
          keystore_path="$signing_dir/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            printf 'Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64.\n' >&2
            exit 1
          fi

          release_name="${GITHUB_REF_NAME//\//-}"
          signed_apk="signed/EInkWiki-${release_name}.apk"
          aligned_apk="$signing_dir/aligned-release.apk"
          "$zipalign_path" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner_path" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$zipalign_path" -c -v 4 "$signed_apk"
          verification_output="$("$apksigner_path" verify --verbose --print-certs "$signed_apk")"
          printf '%s\n' "$verification_output"
          signer_count="$(printf '%s\n' "$verification_output" | sed -n 's/^Number of signers: //p')"
          actual_cert_sha256="$(printf '%s\n' "$verification_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          expected_cert_sha256="0e1e49f9526b8b626a46d0b571db77bbe45e1c7635031c9ddd56553278ef6224"
          if [[ "$signer_count" != "1" || "$actual_cert_sha256" != "$expected_cert_sha256" ]]; then
            printf 'Release signing certificate does not match the published EInkWiki certificate.\n' >&2
            exit 1
          fi

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eink-wiki-release
          path: signed/*.apk
          if-no-files-found: error

  release:
    name: Publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eink-wiki-release
          path: dist

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail
          release_name="${GITHUB_REF_NAME//\//-}"
          apk_name="EInkWiki-${release_name}.apk"
          if [[ ! -f "dist/$apk_name" ]]; then
            printf 'Signed release APK was not downloaded at dist/%s\n' "$apk_name" >&2
            exit 1
          fi
          cd dist
          sha256sum "$apk_name" > "$apk_name.sha256"

      - name: Create verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              printf 'Published release %s already exists; refusing to replace its assets.\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "墨水维基 $GITHUB_REF_NAME" \
              --generate-notes \
              --notes "此 APK 已使用项目固定的 release 证书签名，可在保留离线包和阅读设置的情况下覆盖升级。SHA-256 校验文件与 APK 一并提供；对应源码即此版本标签。"
          fi

          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          apk_name="EInkWiki-${GITHUB_REF_NAME}.apk"
          expected_assets="$(printf '%s\n' "$apk_name" "$apk_name.sha256" | sort)"
          actual_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            printf 'Draft release assets are incomplete or unexpected; leaving the release as a draft.\n' >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
